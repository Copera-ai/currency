# Copera Currency for macOS — XcodeGen spec. Single source of truth for identifiers,
# signing, entitlements and Info.plist keys. Run `make gen` after editing; never edit
# the generated CoperaCurrency.xcodeproj (it is gitignored).
name: CoperaCurrency

options:
  bundleIdPrefix: ai.copera
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

packages:
  CurrencyKit:
    path: Packages/CurrencyKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Keep in sync with SPARKLE_VERSION in scripts/sparkle-tools.sh.
    exactVersion: 2.10.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    ONLY_ACTIVE_ARCH: "YES"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # No team in the repo: set COPERA_TEAM_ID in the environment for signed builds;
    # scripts/release.sh passes DEVELOPMENT_TEAM on the xcodebuild command line.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(COPERA_TEAM_ID)"
    ENABLE_HARDENED_RUNTIME: "YES"
    DEAD_CODE_STRIPPING: "YES"
    MARKETING_VERSION: "1.0.0"
    # Placeholder for local builds; Release builds fail with it (see preBuildScripts).
    CURRENT_PROJECT_VERSION: "1"

targets:
  CoperaCurrency:
    type: application
    platform: macOS
    sources:
      - path: CoperaCurrency
        excludes:
          - Info.plist
          - CoperaCurrency.entitlements
    dependencies:
      - package: CurrencyKit
      - package: Sparkle
      - package: KeyboardShortcuts
    preBuildScripts:
      # Sparkle compares CFBundleVersion: a Release build must carry a real, growing build
      # number. scripts/release.sh passes CURRENT_PROJECT_VERSION=<git commit count>.
      - name: Require release build number
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ] && [ "$CURRENT_PROJECT_VERSION" = "1" ]; then
            echo "error: Release builds need a real build number. Use scripts/release.sh (or make release), which sets CURRENT_PROJECT_VERSION to the git commit count."
            exit 1
          fi
    settings:
      base:
        PRODUCT_NAME: "Copera Currency"
        PRODUCT_MODULE_NAME: CoperaCurrency
        PRODUCT_BUNDLE_IDENTIFIER: ai.copera.currency
        # CoperaCurrency/AppIcon.icon (Icon Composer); regenerate with Branding/make-icons.sh.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: "YES"
        ENABLE_PREVIEWS: "YES"
    info:
      path: CoperaCurrency/Info.plist
      properties:
        CFBundleDisplayName: Copera Currency
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu bar only. The app turns into a regular (Dock) app while Settings is open.
        LSUIElement: true
        NSHumanReadableCopyright: © Christian Curi
        SUFeedURL: https://github.com/Copera-ai/currency/releases/latest/download/appcast.xml
        # EdDSA public key; the private key lives in the login keychain (`make sparkle-key`).
        SUPublicEDKey: 8nCEkTfA1d4uWt7hcN2/YmG8OdPya45zJQRilDQPm3Y=
        SUEnableAutomaticChecks: true
    entitlements:
      path: CoperaCurrency/CoperaCurrency.entitlements
      properties:
        # Not sandboxed (like Drive): Sparkle replaces the app bundle in place on update.
        com.apple.security.network.client: true

schemes:
  CoperaCurrency:
    build:
      targets:
        CoperaCurrency: all
    run:
      config: Debug
    archive:
      config: Release
