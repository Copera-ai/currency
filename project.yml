name: CoperaCurrency

options:
  bundleIdPrefix: ai.copera
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    ONLY_ACTIVE_ARCH: "YES"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: "NO"
    DEAD_CODE_STRIPPING: "YES"

targets:
  CoperaCurrency:
    type: application
    platform: macOS
    sources:
      - path: CoperaCurrency
        excludes:
          - "**/.gitkeep"
          - "Resources/Info.plist"
          - "Resources/CoperaCurrency.entitlements"
    settings:
      base:
        PRODUCT_NAME: "Copera Currency"
        PRODUCT_BUNDLE_IDENTIFIER: ai.copera.currency
        INFOPLIST_FILE: CoperaCurrency/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CoperaCurrency/Resources/CoperaCurrency.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: "YES"
        ENABLE_PREVIEWS: "YES"

schemes:
  CoperaCurrency:
    build:
      targets:
        CoperaCurrency: all
    run:
      config: Debug
    archive:
      config: Release
