# Mirrors the Pasito macOS lint config. Run from Packages/CurrencyKit:
#   swiftlint lint --strict
included:
  - Sources
  - Tests
excluded:
  - .build

disabled_rules:
  - todo
  - trailing_comma
  - identifier_name
  - nesting
  - opening_brace # multi-line signatures put `{` on its own line

opt_in_rules:
  - empty_count
  - first_where
  - closure_spacing
  - redundant_nil_coalescing
  - sorted_imports

line_length:
  warning: 160
  error: 220
  ignores_comments: true
  ignores_urls: true
type_body_length:
  warning: 400
  error: 600
file_length:
  warning: 600
  error: 900
function_body_length:
  warning: 80
  error: 120
cyclomatic_complexity:
  warning: 15
  error: 25
large_tuple:
  warning: 3
